name: Scheduled News Automation

on:
  schedule:
    - cron: '17 */2 * * *'
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      batch_limit:
        description: Maximum stories for this manual production test (default 1)
        type: choice
        options:
          - '1'
          - '2'
          - '3'
        default: '1'

concurrency:
  group: world-bulletin-news-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger the production publishing pipeline
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REQUESTED_BATCH_LIMIT: ${{ inputs.batch_limit }}
        run: |
          if [[ ${#CRON_SECRET} -lt 32 ]]; then
            echo "A CRON_SECRET with at least 32 characters is required in repository secrets."
            exit 1
          fi

          BATCH_LIMIT="${REQUESTED_BATCH_LIMIT:-3}"
          if [[ ! "$BATCH_LIMIT" =~ ^[1-3]$ ]]; then
            echo "Batch limit must be between 1 and 3."
            exit 1
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 600 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "https://worldbulletin.world/api/cron/run?limit=${BATCH_LIMIT}"